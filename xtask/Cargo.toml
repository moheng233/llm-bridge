[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
duct = "1.1.2"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "process-group", "job-object"] }
serde_json = "1.0.151"
