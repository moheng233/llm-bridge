<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- inbound: single OpenAI-compatible stream -->
  <line x1="104" y1="256" x2="176" y2="256" stroke="#06b6d4" stroke-width="13" stroke-linecap="round"/>
  <circle cx="90" cy="256" r="19" fill="#06b6d4"/>
  <circle cx="90" cy="256" r="7" fill="#cffafe"/>

  <!-- the gate: open diamond portal, gaps on the flow axis -->
  <path d="M190 228 L 256 156 L 322 228" fill="none" stroke="url(#portal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 284 L 256 356 L 322 284" fill="none" stroke="url(#portal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LLM spark at the portal core -->
  <path d="M256 214 C 262 242, 268 248, 296 256 C 268 264, 262 270, 256 298 C 250 270, 244 264, 216 256 C 244 248, 250 242, 256 214 Z" fill="#7c3aed"/>
  <circle cx="256" cy="256" r="9" fill="#ede9fe"/>

  <!-- upstream fan-out: routed to three providers -->
  <g fill="none" stroke="url(#flow)" stroke-width="11" stroke-linecap="round">
    <path d="M336 256 C 366 256, 368 170, 424 170"/>
    <path d="M336 256 L 424 256"/>
    <path d="M336 256 C 366 256, 368 342, 424 342"/>
  </g>
  <circle cx="434" cy="170" r="13" fill="#8b5cf6"/>
  <circle cx="434" cy="256" r="13" fill="#06b6d4"/>
  <circle cx="434" cy="342" r="13" fill="#6366f1"/>
</svg>
