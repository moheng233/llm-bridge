[package]
name = "llm-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
aisdk = { version = "0.5.2", features = ["openai"] }
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
bitflags = { version = "2.11.0", features = ["serde", "std"] }
futures = "0.3.32"
futures-util = "0.3.32"
keyring = "3.6.3"
ractor = { version = "0.15.12", features = ["async-trait"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
sea-orm = { version = "2.0.0-rc", features = [
  "entity-registry",
  "macros",
  "runtime-tokio-rustls",
  "schema-sync",
  "sqlx-sqlite",
  "with-json",
  "with-time"
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "std"] }
tokio = { version = "1.50.0", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }
