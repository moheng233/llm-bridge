[package]
name = "llm-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axfetchum = { version = "0.1.0", features = ["axum"] }
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
bincode-next = { version = "2.1.0", features = ["derive", "serde"] }
bitflags = { version = "2.11.0", features = ["serde", "std"] }
fjall = "3.1.2"
futures = "0.3.32"
futures-util = "0.3.32"
opentelemetry = { version = "0.31.0", features = ["logs"] }
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-otlp = "0.31.1"
opentelemetry_sdk = { version = "0.31.0", features = ["logs"] }
opentelemetry-stdout = "0.31.0"
ractor = { version = "0.15.12", features = ["async-trait"] }
reqwest = { version = "0.13.2", default-features = false, features = [
  "json",
  "rustls-no-provider",
  "stream"
] }
rustls = { version = "0.23.37", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde", "std"] }
tokio = { version = "1.50.0", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde_json", "tokio", "uuid"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.14.0"
