name: build-and-contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy --component rustc-codegen-cranelift
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Install pnpm
        run: npm install --global pnpm@11.26.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check bindings without overwriting committed files
        run: cargo xtask bindings --check
      - name: Check backend behavior contracts
        run: cargo test -p llm-bridge --all-targets --locked -- --skip export_bindings
      - name: Check default features
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check development orchestration
        run: cargo test -p xtask --locked
      - name: Build application from clean frontend declarations
        run: cargo xtask build --debug --features otel,postgresql
      - name: Check frontend lint
        working-directory: frontend
        run: pnpm run lint
      - name: Check production features
        run: cargo clippy -p llm-bridge --all-targets --no-default-features --features embed-frontend,otel,postgresql --locked -- -D warnings
      - name: Check telemetry runtime export and shutdown
        run: cargo test -p llm-bridge --no-default-features --features embed-frontend,otel,postgresql --test otel_contract --locked
      - name: Install catalog dependencies
        working-directory: scripts/models-dev-catalog
        run: bun install --frozen-lockfile
      - name: Check catalog derivation contracts
        working-directory: scripts/models-dev-catalog
        run: bun test
